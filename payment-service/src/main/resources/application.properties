spring.application.name=payment-service

server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Base URL of Product Service - Order Service calls this over HTTP
order-service.base-url=${ORDER_SERVICE_URL:http://localhost:8081}